[project]
name = "mathmodel2026b"
version = "0.4.0"
description = "2026 CUMCM Problem B lightweight simulator/planning framework"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: 30 seed 级别的回归（默认会跑；用 -m 'not slow' 跳过）",
]
