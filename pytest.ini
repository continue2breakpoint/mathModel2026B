[pytest]
# 让 `python3 -m pytest -q` 在**仓库根目录**就能跑通（不必再手写 PYTHONPATH）：
# `framework/pyproject.toml` 里那份配置只在 rootdir 落在 framework/ 时才生效，
# 而从仓库根跑测试时 rootdir 是 mathModel2026B/，那份配置不会被读到。
pythonpath = framework/src
testpaths = framework/tests script
addopts = -q
markers =
    slow: 30 seed 级别的回归（默认会跑；用 -m 'not slow' 跳过）
